# tmux.conf — repo raphaelc0elh0/tmux-config (criado em 25/09/2026; ~/.tmux.conf é link para cá)

# Básico
set -g mouse on                  # clicar em painel, arrastar divisória, rolar com trackpad
set -g history-limit 50000
set -g base-index 1              # janelas começam em 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10           # Esc responde na hora (importante no Claude Code)
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g extended-keys on          # Shift+Enter etc. chegam ao Claude Code
set -g set-clipboard on
setw -g window-size latest       # várias conexões na mesma sessão: vale o tamanho da última ativa

# Seletor de sessões com preview ao vivo
#   Ctrl-b s  -> todas as sessões (ordenadas por nome, tela cheia)
#   Ctrl-b w  -> sessões + janelas + painéis
bind s choose-tree -sZ -O name
bind w choose-tree -Z -O name

# Splits intuitivos, abrindo na mesma pasta
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Painéis lado a lado em colunas iguais: Ctrl-b =
bind = select-layout even-horizontal

# Navegar entre painéis com Alt+setas (sem prefixo)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Criar sessão nova pelo nome: Ctrl-b N
bind N command-prompt -p "nova sessão:" "new-session -d -s '%%' -c ~ \; switch-client -t '%%'"

# Recarregar config: Ctrl-b r
bind r source-file ~/.tmux.conf \; display "tmux.conf recarregado"


# tmux2k — https://github.com/2KAbhishek/tmux2k (clone em ~/.tmux/plugins/tmux2k)
# tmux >= 3.7 vive em ~/tools/bin (binário estático). Plugins chamam `tmux` do PATH em
# run-shell; se o PATH do servidor (herdado do ttyd/systemd) só tiver o /usr/bin (3.4),
# cliente velho não fala com servidor novo e tmux2k/tmux-menus falham em silêncio.
%if #{||:#{||:#{m:3.[7-9]*,#{version}},#{m:3.[1-9][0-9]*,#{version}}},#{m:[4-9].*,#{version}}}
set-environment -g PATH "$HOME/tools/bin:$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin"
%endif

set -g status-interval 5
set -g @tmux2k-theme 'default'
set -g @tmux2k-left-plugins 'session'
set -g @tmux2k-right-plugins 'ram cpu time'
set -g @tmux2k-time-format '%H:%M UTC'        # 24 h, no fuso da máquina (padrão: "%a %I:%M %p")
set -g @tmux2k-window-list-alignment 'left'   # janelas à esquerda (padrão: centro)
set -g @tmux2k-bg-main 'default'             # sem fundo: a barra usa a cor do terminal
set -g @tmux2k-dark-gray '#5c5c6e'            # abas inativas, mais claras que o fundo
set -g pane-active-border-style "fg=colour81"
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"   # tmux-menus > Plugins inventory
run-shell ~/.tmux/plugins/tmux2k/2k.tmux
# abas sem fundo: só o bg preto vira "default"; o fg preto do texto da aba ativa fica (senão herda a cor da borda e não se lê)
run-shell 'for o in window-status-format window-status-current-format; do tmux setw -g $o "$(tmux show -gwv $o | sed "s/bg=#000000/bg=default/g")"; done'
# As pontas das abas saem com bg preto fixo (a cor também é o texto da aba ativa): troca só o bg pelo cinza.

# Celular: barra estreita, as janelas empurravam CPU/RAM para fora. Segunda linha só para elas:
# guarda o status-left/right que o tmux2k montou, esvazia a linha 1 (só janelas) e os mostra na linha 2.
run-shell 'tmux set -g @k2-left "$(tmux show -gv status-left)"; tmux set -g status-left ""; tmux set -g @k2-right "$(tmux show -gv status-right)"; tmux set -g status-right ""'
set -g status 2
source-file ~/.tmux.conf.d/mouse.conf   # barra de botões + mouse (status-format[1] vive lá)
