# tmux.conf — repo raphaelc0elh0/tmux-config (created 2026-09-25; ~/.tmux.conf is a symlink here)

# Basics
set -g mouse on                  # click panes, drag dividers, scroll with the trackpad
set -g history-limit 50000
set -g base-index 1              # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10           # Esc responds immediately (matters for Claude Code)
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g extended-keys on          # Shift+Enter etc. reach Claude Code
set -g set-clipboard on
setw -g window-size latest       # several clients on one session: size follows the last active one

# Session picker with live preview
#   Ctrl-b s  -> all sessions (sorted by name, full screen)
#   Ctrl-b w  -> sessions + windows + panes
bind s choose-tree -sZ -O name
bind w choose-tree -Z -O name

# Intuitive splits, opening in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Panes side by side in equal columns: Ctrl-b =
bind = select-layout even-horizontal

# Move between panes with Alt+arrows (no prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# New session by name: Ctrl-b N
bind N command-prompt -p "new session:" "new-session -d -s '%%' -c ~ \; switch-client -t '%%'"

# Reload config: Ctrl-b r
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"


# tmux2k — https://github.com/2KAbhishek/tmux2k (cloned at ~/.tmux/plugins/tmux2k)
# tmux >= 3.7 lives in ~/tools/bin (static binary). Plugins call `tmux` from PATH inside
# run-shell; if the server's PATH (inherited from ttyd/systemd) only has /usr/bin (3.4),
# the old client cannot talk to the new server and tmux2k/tmux-menus fail silently.
%if #{||:#{||:#{m:3.[7-9]*,#{version}},#{m:3.[1-9][0-9]*,#{version}}},#{m:[4-9].*,#{version}}}
set-environment -g PATH "$HOME/tools/bin:$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin"
%endif

set -g status-interval 5
set -g @tmux2k-theme 'default'
set -g @tmux2k-left-plugins 'session'
set -g @tmux2k-right-plugins 'ram cpu time'
set -g @tmux2k-time-format '%H:%M UTC'        # 24 h, machine time zone (default: "%a %I:%M %p")
set -g @tmux2k-window-list-alignment 'left'   # windows on the left (default: centre)
set -g @tmux2k-bg-main 'default'             # no background: the bar uses the terminal colour
set -g @tmux2k-dark-gray '#5c5c6e'            # inactive tabs, lighter than the background
set -g pane-active-border-style "fg=colour81"
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"   # tmux-menus > Plugins inventory
run-shell ~/.tmux/plugins/tmux2k/2k.tmux
# Tabs without background: only the black bg becomes "default"; the black fg of the active tab's text
# stays (otherwise it inherits the border colour and becomes unreadable).
run-shell 'for o in window-status-format window-status-current-format; do tmux setw -g $o "$(tmux show -gwv $o | sed "s/bg=#000000/bg=default/g")"; done'
# The tab ends come out with a fixed black bg (that colour is also the active tab's text): swap only the bg for grey.

# tmux-resurrect + tmux-continuum (2026-10-17, after a Hostinger shutdown took every window down)
#   Ctrl-b Ctrl-s saves · Ctrl-b Ctrl-r restores · saved under ~/.local/share/tmux/resurrect/
# continuum saves every 15 min and restores on its own when the tmux server starts.
# claude comes back through ~/.tmux/claude-restore: started with --resume <id>, it reopens that conversation;
# started bare, it comes back with --continue (the most recent one in THAT directory — two bare panes in the
# same directory come back in the same conversation; use `/resume` in the other one).
# Not submodules: they only load where they are cloned under ~/.tmux/plugins.
# Order matters: continuum hooks into status-right, so it loads after tmux2k and before the block below,
# which moves status-right into @k2-right (the trigger goes along). if-shell without -b runs now, in order.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes '"~claude->~/.tmux/claude-restore *"'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
if-shell 'test -f ~/.tmux/plugins/tmux-resurrect/resurrect.tmux' 'run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux'
if-shell 'test -f ~/.tmux/plugins/tmux-continuum/continuum.tmux' 'run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux'

# Phone: narrow bar, the windows pushed CPU/RAM off screen. A second line just for them:
# keep the status-left/right tmux2k built, empty line 1 (windows only) and show them on line 2.
run-shell 'tmux set -g @k2-left "$(tmux show -gv status-left)"; tmux set -g status-left ""; tmux set -g @k2-right "$(tmux show -gv status-right)"; tmux set -g status-right ""'
set -g status 2
source-file ~/.tmux.conf.d/mouse.conf   # button bar + mouse (status-format[1] lives there)
