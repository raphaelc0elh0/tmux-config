# ── tmux só no mouse: barra de botões + abas estilo navegador ──────────────
# Carregado pelo ~/.tmux.conf. Para desligar, comente a linha source-file lá.

# Barra de status fica embaixo como antes: linha 1 = abas, linha 2 = sessão | ram cpu hora
set -g status-position bottom
set -gu status-format          # volta a linha 1 ao padrão (lista de janelas); -u só no índice 0 deixava a linha vazia
set -g status-format[1] "#[align=left]#{E:@k2-left}#[align=right]#{E:@k2-right}"

# ── Barra de botões ───────────────────────────────────────────────────────────
# tmux >= 3.7: botões de verdade na borda SUPERIOR do painel (ranges "control|N",
# teclas MouseDown1ControlN). tmux 3.4: a borda superior não recebe clique e a
# borda não traz mouse_x, então vale a faixa na borda inferior que abre um menu.
%if #{||:#{||:#{m:3.[7-9]*,#{version}},#{m:3.[1-9][0-9]*,#{version}}},#{m:[4-9].*,#{version}}}
# ── tmux >= 3.7 ─────────────────────────────────────────────────────────────
# Topo (barra de status, 1 linha): sessão + botão ☰ Menu | ram cpu hora.
# Rodapé: abas na borda inferior do painel do canto inferior esquerdo (ranges
# "control|N" → teclas MouseDown1ControlN). Limite do tmux: só 10 controles, então
# só as janelas 1–9 são clicáveis; a partir da 10 use o nome na barra ou prefix+n.
set -g status-position top
set -g status on               # uma linha (valores válidos: off, on, 2..5)
set -g @btn "#[fg=#d0d0d0,bg=#5c5c6e,nobold]"
# bloco da sessão: o do tmux2k sem o triângulo (powerline), retângulo colado ao botão ☰
set -g @sessao '#[range=user|session]#[fg=#000000,bg=#3dd50a]#{?client_prefix,#[bg=#1688f0],} #(~/.tmux/plugins/tmux2k/plugins/session.sh "#{pane_current_path}" "#{session_name}") #[norange default]'
set -g status-format[0] "#[align=left]#{E:@sessao}#{E:@btn}#[range=user|menu] ☰ Menu #[norange]#[default]#[align=right]#{E:@k2-right}"

# clique na barra do topo: ☰ → menu completo; sessão → lista de sessões; cpu/ram → btop (tmux2k)
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},menu}' { run-shell ~/.tmux/plugins/tmux-menus/items/main.sh } {
  if -F '#{==:#{mouse_status_range},session}' { choose-tree -sZ -O name } {
  if -F '#{||:#{==:#{mouse_status_range},cpu},#{==:#{mouse_status_range},ram}}' { run-shell -b "~/.tmux/plugins/tmux2k/lib/popup_handler.sh right '#{mouse_x}' '#{client_width}' '#{mouse_status_range}'" } } }

# abas no rodapé: lista de janelas na borda inferior, com o visual do tmux2k
set -g pane-border-status bottom
set -g pane-border-lines single
set -g @abas "#{W:#{?#{e|<:#{window_index},10},#[range=control|#{window_index}],}#{T:window-status-format}#[norange] ,#{?#{e|<:#{window_index},10},#[range=control|#{window_index}],}#{T:window-status-current-format}#[norange] }"
set -g pane-border-format "#{?#{&&:#{pane_at_left},#{pane_at_bottom}},#{E:@abas},#[fg=#8a8a8a] #{pane_index}: #{pane_current_command} }"
bind -n MouseDown1Border select-pane -t =    # precisa existir: sem bind no clique simples, o duplo não dispara
bind -n DoubleClick1Border new-window -c "#{pane_current_path}"
bind -n MouseDown3Border display-menu -O -T "#[align=centre] Ações " -x M -y M \
    "Nova janela"       c "new-window -c '#{pane_current_path}'" \
    "Dividir ◧"         | "split-window -h -c '#{pane_current_path}'" \
    "Dividir ⬒"         - "split-window -v -c '#{pane_current_path}'" \
    "Zoom (liga/desl.)" z "resize-pane -Z" \
    "Igualar painéis"   = "select-layout even-horizontal" \
    "Menu completo"     m "run-shell ~/.tmux/plugins/tmux-menus/items/main.sh"
bind -n MouseDown1Control1 select-window -t :1
bind -n MouseDown2Control1 confirm-before -p "Fechar janela 1:#{window_name}? (y/n)" "kill-window -t :1"
bind -n MouseDown3Control1 display-menu -O -T "#[align=centre] Janela 1 " -x M -y M \
    "Ir para" Enter "select-window -t :1" \
    "Renomear" r "command-prompt -I '#W' -p 'nome:' { rename-window -t :1 '%%' }" \
    "" \
    "Mover para ←" < "swap-window -s :1 -t :1" \
    "Mover para →" > "swap-window -s :1 -t :2" \
    "" \
    "#[fg=red]Fechar janela" x "confirm-before -p 'Fechar janela 1? (y/n)' 'kill-window -t :1'"
bind -n MouseDown1Control2 select-window -t :2
bind -n MouseDown2Control2 confirm-before -p "Fechar janela 2:#{window_name}? (y/n)" "kill-window -t :2"
bind -n MouseDown3Control2 display-menu -O -T "#[align=centre] Janela 2 " -x M -y M \
    "Ir para" Enter "select-window -t :2" \
    "Renomear" r "command-prompt -I '#W' -p 'nome:' { rename-window -t :2 '%%' }" \
    "" \
    "Mover para ←" < "swap-window -s :2 -t :1" \
    "Mover para →" > "swap-window -s :2 -t :3" \
    "" \
    "#[fg=red]Fechar janela" x "confirm-before -p 'Fechar janela 2? (y/n)' 'kill-window -t :2'"
bind -n MouseDown1Control3 select-window -t :3
bind -n MouseDown2Control3 confirm-before -p "Fechar janela 3:#{window_name}? (y/n)" "kill-window -t :3"
bind -n MouseDown3Control3 display-menu -O -T "#[align=centre] Janela 3 " -x M -y M \
    "Ir para" Enter "select-window -t :3" \
    "Renomear" r "command-prompt -I '#W' -p 'nome:' { rename-window -t :3 '%%' }" \
    "" \
    "Mover para ←" < "swap-window -s :3 -t :2" \
    "Mover para →" > "swap-window -s :3 -t :4" \
    "" \
    "#[fg=red]Fechar janela" x "confirm-before -p 'Fechar janela 3? (y/n)' 'kill-window -t :3'"
bind -n MouseDown1Control4 select-window -t :4
bind -n MouseDown2Control4 confirm-before -p "Fechar janela 4:#{window_name}? (y/n)" "kill-window -t :4"
bind -n MouseDown3Control4 display-menu -O -T "#[align=centre] Janela 4 " -x M -y M \
    "Ir para" Enter "select-window -t :4" \
    "Renomear" r "command-prompt -I '#W' -p 'nome:' { rename-window -t :4 '%%' }" \
    "" \
    "Mover para ←" < "swap-window -s :4 -t :3" \
    "Mover para →" > "swap-window -s :4 -t :5" \
    "" \
    "#[fg=red]Fechar janela" x "confirm-before -p 'Fechar janela 4? (y/n)' 'kill-window -t :4'"
bind -n MouseDown1Control5 select-window -t :5
bind -n MouseDown2Control5 confirm-before -p "Fechar janela 5:#{window_name}? (y/n)" "kill-window -t :5"
bind -n MouseDown3Control5 display-menu -O -T "#[align=centre] Janela 5 " -x M -y M \
    "Ir para" Enter "select-window -t :5" \
    "Renomear" r "command-prompt -I '#W' -p 'nome:' { rename-window -t :5 '%%' }" \
    "" \
    "Mover para ←" < "swap-window -s :5 -t :4" \
    "Mover para →" > "swap-window -s :5 -t :6" \
    "" \
    "#[fg=red]Fechar janela" x "confirm-before -p 'Fechar janela 5? (y/n)' 'kill-window -t :5'"
bind -n MouseDown1Control6 select-window -t :6
bind -n MouseDown2Control6 confirm-before -p "Fechar janela 6:#{window_name}? (y/n)" "kill-window -t :6"
bind -n MouseDown3Control6 display-menu -O -T "#[align=centre] Janela 6 " -x M -y M \
    "Ir para" Enter "select-window -t :6" \
    "Renomear" r "command-prompt -I '#W' -p 'nome:' { rename-window -t :6 '%%' }" \
    "" \
    "Mover para ←" < "swap-window -s :6 -t :5" \
    "Mover para →" > "swap-window -s :6 -t :7" \
    "" \
    "#[fg=red]Fechar janela" x "confirm-before -p 'Fechar janela 6? (y/n)' 'kill-window -t :6'"
bind -n MouseDown1Control7 select-window -t :7
bind -n MouseDown2Control7 confirm-before -p "Fechar janela 7:#{window_name}? (y/n)" "kill-window -t :7"
bind -n MouseDown3Control7 display-menu -O -T "#[align=centre] Janela 7 " -x M -y M \
    "Ir para" Enter "select-window -t :7" \
    "Renomear" r "command-prompt -I '#W' -p 'nome:' { rename-window -t :7 '%%' }" \
    "" \
    "Mover para ←" < "swap-window -s :7 -t :6" \
    "Mover para →" > "swap-window -s :7 -t :8" \
    "" \
    "#[fg=red]Fechar janela" x "confirm-before -p 'Fechar janela 7? (y/n)' 'kill-window -t :7'"
bind -n MouseDown1Control8 select-window -t :8
bind -n MouseDown2Control8 confirm-before -p "Fechar janela 8:#{window_name}? (y/n)" "kill-window -t :8"
bind -n MouseDown3Control8 display-menu -O -T "#[align=centre] Janela 8 " -x M -y M \
    "Ir para" Enter "select-window -t :8" \
    "Renomear" r "command-prompt -I '#W' -p 'nome:' { rename-window -t :8 '%%' }" \
    "" \
    "Mover para ←" < "swap-window -s :8 -t :7" \
    "Mover para →" > "swap-window -s :8 -t :9" \
    "" \
    "#[fg=red]Fechar janela" x "confirm-before -p 'Fechar janela 8? (y/n)' 'kill-window -t :8'"
bind -n MouseDown1Control9 select-window -t :9
bind -n MouseDown2Control9 confirm-before -p "Fechar janela 9:#{window_name}? (y/n)" "kill-window -t :9"
bind -n MouseDown3Control9 display-menu -O -T "#[align=centre] Janela 9 " -x M -y M \
    "Ir para" Enter "select-window -t :9" \
    "Renomear" r "command-prompt -I '#W' -p 'nome:' { rename-window -t :9 '%%' }" \
    "" \
    "Mover para ←" < "swap-window -s :9 -t :8" \
    "Mover para →" > "swap-window -s :9 -t :10" \
    "" \
    "#[fg=red]Fechar janela" x "confirm-before -p 'Fechar janela 9? (y/n)' 'kill-window -t :9'"
%else
# Faixa de ações na borda INFERIOR do painel (logo acima das abas).
# Clicar em qualquer ponto da faixa abre o menu de ações sob o mouse.
# Por que não são botões separados: no tmux 3.4 um clique na borda não traz mouse_x/mouse_y
# (só dentro do painel ou na barra de status), e a borda superior nem gera evento.
# O tmux >= 3.7 entrega as duas coisas; aí dá para trocar por botões de verdade, no topo.
set -g pane-border-status bottom
set -g pane-border-lines single
set -g @faixa "#[fg=#d0d0d0,bg=#5c5c6e,nobold] ☰ Ações: Nova · Dividir · Zoom · Fechar · Menu #[default]"
set -g pane-border-format "#{?#{&&:#{pane_at_left},#{pane_at_bottom}},#{E:@faixa},#[fg=#8a8a8a] #{pane_index}: #{pane_current_command} }"

bind -n MouseDown1Border select-pane -t = \; display-menu -O -T "#[align=centre] Ações " -x 2 -y S \
    "Nova janela"       c "new-window -c '#{pane_current_path}'" \
    "Dividir ◧"         | "split-window -h -c '#{pane_current_path}'" \
    "Dividir ⬒"         - "split-window -v -c '#{pane_current_path}'" \
    "" \
    "Zoom (liga/desl.)" z "resize-pane -Z" \
    "Igualar painéis"   = "select-layout even-horizontal" \
    "Renomear janela"   , "command-prompt -I '#W' -p 'nome:' { rename-window '%%' }" \
    "" \
    "Menu completo"     m "run-shell ~/.tmux/plugins/tmux-menus/items/main.sh" \
    "" \
    "#[fg=red]Fechar painel" x "confirm-before -p 'Fechar este painel? (y/n)' kill-pane" \
    "#[fg=red]Fechar janela" X "confirm-before -p 'Fechar esta janela? (y/n)' kill-window"

# Clique esquerdo na barra de baixo: aba → troca de janela; sessão → lista; cpu/ram → btop (tmux2k)
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},window}' { select-window -t = } {
  if -F '#{==:#{mouse_status_range},session}' { choose-tree -sZ -O name } {
  if -F '#{||:#{==:#{mouse_status_range},cpu},#{==:#{mouse_status_range},ram}}' { run-shell -b "~/.tmux/plugins/tmux2k/lib/popup_handler.sh right '#{mouse_x}' '#{client_width}' '#{mouse_status_range}'" } } }
%endif

# Abas como no navegador
bind -n DoubleClick1StatusDefault new-window -c "#{pane_current_path}"   # 2 cliques no vazio = nova janela
bind -n MouseDown2Status if -F '#{==:#{mouse_status_range},window}' { confirm-before -p "Fechar janela #{window_name}? (y/n)" "kill-window -t =" }   # botão do meio fecha
bind -n MouseDrag1Status if -F '#{==:#{mouse_status_range},window}' { swap-window -d -t = }   # arrastar reordena

# Botão direito na aba
bind -n MouseDown3Status if -F '#{==:#{mouse_status_range},session}' { display-menu -O -T "#[align=centre] Sessões " -x M -y S "Escolher sessão" s "choose-tree -sZ -O name" "Nova sessão" N "command-prompt -p 'nova sessão:' { new-session -d -s '%%' -c ~ ; switch-client -t '%%' }" "Renomear sessão" $ "command-prompt -I '#S' -p 'nome:' { rename-session '%%' }" "" "Desconectar" d "detach-client" } {
  if -F '#{==:#{mouse_status_range},window}' {
  display-menu -O -T "#[align=centre] #{window_index}: #{window_name} " -x W -y S \
    "Ir para"          Enter "select-window -t =" \
    "Renomear"         r     "command-prompt -I '#W' -p 'nome:' { rename-window -t = '%%' }" \
    "" \
    "Mover para ←"     <     "swap-window -d -t -1" \
    "Mover para →"     >     "swap-window -d -t +1" \
    "" \
    "#[fg=red]Fechar janela" x "kill-window -t ="
} }

# Botão direito no painel
bind -n MouseDown3Pane select-pane -t = \; display-menu -O -T "#[align=centre] Painel " -x M -y M \
    "Nova janela"      c "new-window -c '#{pane_current_path}'" \
    "Dividir ◧"        | "split-window -h -c '#{pane_current_path}'" \
    "Dividir ⬒"        - "split-window -v -c '#{pane_current_path}'" \
    "" \
    "Zoom (liga/desl.)" z "resize-pane -Z" \
    "Igualar painéis"  = "select-layout even-horizontal" \
    "Renomear janela"  , "command-prompt -I '#W' -p 'nome:' { rename-window '%%' }" \
    "Colar"            p "paste-buffer -p" \
    "" \
    "Menu completo"    m "run-shell ~/.tmux/plugins/tmux-menus/items/main.sh" \
    "" \
    "#[fg=red]Fechar painel" x "kill-pane" \
    "#[fg=red]Fechar janela" X "kill-window"

# Botão direito no nome da sessão (esquerda da barra)
bind -n MouseDown3StatusLeft display-menu -O -T "#[align=centre] Sessões " -x M -y S \
    "Escolher sessão"  s "choose-tree -sZ -O name" \
    "Nova sessão"      N "command-prompt -p 'nova sessão:' { new-session -d -s '%%' -c ~ ; switch-client -t '%%' }" \
    "Renomear sessão"  $ "command-prompt -I '#S' -p 'nome:' { rename-session '%%' }" \
    "" \
    "Desconectar"      d "detach-client"

# tmux-menus (prefix + \ ou botão ☰)
set -g @menus_location_x 'C'
set -g @menus_location_y 'C'
run-shell ~/.tmux/plugins/tmux-menus/menus.tmux
