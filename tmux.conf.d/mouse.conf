# ── Mouse-only tmux: button bar + browser-style tabs ───────────────────────────
# Loaded by ~/.tmux.conf. To turn it off, comment out the source-file line there.

# Status bar stays at the bottom as before: line 1 = tabs, line 2 = session | ram cpu time
set -g status-position bottom
set -gu status-format          # line 1 back to default (window list); -u on index 0 alone left the line empty
set -g status-format[1] "#[align=left]#{E:@k2-left}#[align=right]#{E:@k2-right}"

# ── Button bar ────────────────────────────────────────────────────────────────
# tmux >= 3.7: real buttons on the TOP border of the pane (ranges "control|N",
# keys MouseDown1ControlN). tmux 3.4: the top border gets no clicks and borders
# carry no mouse_x, so a strip on the bottom border that opens a menu is what works.
%if #{||:#{||:#{m:3.[7-9]*,#{version}},#{m:3.[1-9][0-9]*,#{version}}},#{m:[4-9].*,#{version}}}
# ── tmux >= 3.7 ─────────────────────────────────────────────────────────────
# Top (status bar, 1 line): session + ☰ Menu button | ram cpu time.
# Bottom: tabs on the bottom border of the bottom-left pane (ranges "control|N" →
# keys MouseDown1ControlN). tmux limit: only 10 controls, so only windows 1–9 are
# clickable; from 10 on use the name in the bar or prefix+n.
set -g status-position top
set -g status on               # one line (valid values: off, on, 2..5)
set -g @btn "#[fg=#d0d0d0,bg=#5c5c6e,nobold]"
# session block: tmux2k's without the (powerline) triangle, a rectangle glued to the ☰ button
set -g @session-block '#[range=user|session]#[fg=#000000,bg=#3dd50a]#{?client_prefix,#[bg=#1688f0],} #(~/.tmux/plugins/tmux2k/plugins/session.sh "#{pane_current_path}" "#{session_name}") #[norange default]'
set -g status-format[0] "#[align=left]#{E:@session-block}#{E:@btn}#[range=user|menu] ☰ Menu #[norange]#[default]#[align=right]#{E:@k2-right}"

# click on the top bar: ☰ → full menu; session → session list; cpu/ram → btop (tmux2k)
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},menu}' { run-shell ~/.tmux/plugins/tmux-menus/items/main.sh } {
  if -F '#{==:#{mouse_status_range},session}' { choose-tree -sZ -O name } {
  if -F '#{||:#{==:#{mouse_status_range},cpu},#{==:#{mouse_status_range},ram}}' { run-shell -b "~/.tmux/plugins/tmux2k/lib/popup_handler.sh right '#{mouse_x}' '#{client_width}' '#{mouse_status_range}'" } } }

# tabs at the bottom: window list on the bottom border, with tmux2k's look
set -g pane-border-status bottom
set -g pane-border-lines single
set -g @tabs "#{W:#{?#{e|<:#{window_index},10},#[range=control|#{window_index}],}#{T:window-status-format}#[norange] ,#{?#{e|<:#{window_index},10},#[range=control|#{window_index}],}#{T:window-status-current-format}#[norange] }"
set -g pane-border-format "#{?#{&&:#{pane_at_left},#{pane_at_bottom}},#{E:@tabs},#[fg=#8a8a8a] #{pane_index}: #{pane_current_command} }"
bind -n MouseDown1Border select-pane -t =    # must exist: without a single-click bind, the double click never fires
bind -n DoubleClick1Border new-window -c "#{pane_current_path}"
bind -n MouseDown3Border display-menu -O -T "#[align=centre] Actions " -x M -y M \
    "New window"        c "new-window -c '#{pane_current_path}'" \
    "Split ◧"           | "split-window -h -c '#{pane_current_path}'" \
    "Split ⬒"           - "split-window -v -c '#{pane_current_path}'" \
    "Zoom (toggle)"     z "resize-pane -Z" \
    "Even panes"        = "select-layout even-horizontal" \
    "Full menu"         m "run-shell ~/.tmux/plugins/tmux-menus/items/main.sh"
bind -n MouseDown1Control1 select-window -t :1
bind -n MouseDown2Control1 confirm-before -p "Close window 1:#{window_name}? (y/n)" "kill-window -t :1"
bind -n MouseDown3Control1 display-menu -O -T "#[align=centre] Window 1 " -x M -y M \
    "Go to" Enter "select-window -t :1" \
    "Rename" r "command-prompt -I '#W' -p 'name:' { rename-window -t :1 '%%' }" \
    "" \
    "Move ←" < "swap-window -s :1 -t :1" \
    "Move →" > "swap-window -s :1 -t :2" \
    "" \
    "#[fg=red]Close window" x "confirm-before -p 'Close window 1? (y/n)' 'kill-window -t :1'"
bind -n MouseDown1Control2 select-window -t :2
bind -n MouseDown2Control2 confirm-before -p "Close window 2:#{window_name}? (y/n)" "kill-window -t :2"
bind -n MouseDown3Control2 display-menu -O -T "#[align=centre] Window 2 " -x M -y M \
    "Go to" Enter "select-window -t :2" \
    "Rename" r "command-prompt -I '#W' -p 'name:' { rename-window -t :2 '%%' }" \
    "" \
    "Move ←" < "swap-window -s :2 -t :1" \
    "Move →" > "swap-window -s :2 -t :3" \
    "" \
    "#[fg=red]Close window" x "confirm-before -p 'Close window 2? (y/n)' 'kill-window -t :2'"
bind -n MouseDown1Control3 select-window -t :3
bind -n MouseDown2Control3 confirm-before -p "Close window 3:#{window_name}? (y/n)" "kill-window -t :3"
bind -n MouseDown3Control3 display-menu -O -T "#[align=centre] Window 3 " -x M -y M \
    "Go to" Enter "select-window -t :3" \
    "Rename" r "command-prompt -I '#W' -p 'name:' { rename-window -t :3 '%%' }" \
    "" \
    "Move ←" < "swap-window -s :3 -t :2" \
    "Move →" > "swap-window -s :3 -t :4" \
    "" \
    "#[fg=red]Close window" x "confirm-before -p 'Close window 3? (y/n)' 'kill-window -t :3'"
bind -n MouseDown1Control4 select-window -t :4
bind -n MouseDown2Control4 confirm-before -p "Close window 4:#{window_name}? (y/n)" "kill-window -t :4"
bind -n MouseDown3Control4 display-menu -O -T "#[align=centre] Window 4 " -x M -y M \
    "Go to" Enter "select-window -t :4" \
    "Rename" r "command-prompt -I '#W' -p 'name:' { rename-window -t :4 '%%' }" \
    "" \
    "Move ←" < "swap-window -s :4 -t :3" \
    "Move →" > "swap-window -s :4 -t :5" \
    "" \
    "#[fg=red]Close window" x "confirm-before -p 'Close window 4? (y/n)' 'kill-window -t :4'"
bind -n MouseDown1Control5 select-window -t :5
bind -n MouseDown2Control5 confirm-before -p "Close window 5:#{window_name}? (y/n)" "kill-window -t :5"
bind -n MouseDown3Control5 display-menu -O -T "#[align=centre] Window 5 " -x M -y M \
    "Go to" Enter "select-window -t :5" \
    "Rename" r "command-prompt -I '#W' -p 'name:' { rename-window -t :5 '%%' }" \
    "" \
    "Move ←" < "swap-window -s :5 -t :4" \
    "Move →" > "swap-window -s :5 -t :6" \
    "" \
    "#[fg=red]Close window" x "confirm-before -p 'Close window 5? (y/n)' 'kill-window -t :5'"
bind -n MouseDown1Control6 select-window -t :6
bind -n MouseDown2Control6 confirm-before -p "Close window 6:#{window_name}? (y/n)" "kill-window -t :6"
bind -n MouseDown3Control6 display-menu -O -T "#[align=centre] Window 6 " -x M -y M \
    "Go to" Enter "select-window -t :6" \
    "Rename" r "command-prompt -I '#W' -p 'name:' { rename-window -t :6 '%%' }" \
    "" \
    "Move ←" < "swap-window -s :6 -t :5" \
    "Move →" > "swap-window -s :6 -t :7" \
    "" \
    "#[fg=red]Close window" x "confirm-before -p 'Close window 6? (y/n)' 'kill-window -t :6'"
bind -n MouseDown1Control7 select-window -t :7
bind -n MouseDown2Control7 confirm-before -p "Close window 7:#{window_name}? (y/n)" "kill-window -t :7"
bind -n MouseDown3Control7 display-menu -O -T "#[align=centre] Window 7 " -x M -y M \
    "Go to" Enter "select-window -t :7" \
    "Rename" r "command-prompt -I '#W' -p 'name:' { rename-window -t :7 '%%' }" \
    "" \
    "Move ←" < "swap-window -s :7 -t :6" \
    "Move →" > "swap-window -s :7 -t :8" \
    "" \
    "#[fg=red]Close window" x "confirm-before -p 'Close window 7? (y/n)' 'kill-window -t :7'"
bind -n MouseDown1Control8 select-window -t :8
bind -n MouseDown2Control8 confirm-before -p "Close window 8:#{window_name}? (y/n)" "kill-window -t :8"
bind -n MouseDown3Control8 display-menu -O -T "#[align=centre] Window 8 " -x M -y M \
    "Go to" Enter "select-window -t :8" \
    "Rename" r "command-prompt -I '#W' -p 'name:' { rename-window -t :8 '%%' }" \
    "" \
    "Move ←" < "swap-window -s :8 -t :7" \
    "Move →" > "swap-window -s :8 -t :9" \
    "" \
    "#[fg=red]Close window" x "confirm-before -p 'Close window 8? (y/n)' 'kill-window -t :8'"
bind -n MouseDown1Control9 select-window -t :9
bind -n MouseDown2Control9 confirm-before -p "Close window 9:#{window_name}? (y/n)" "kill-window -t :9"
bind -n MouseDown3Control9 display-menu -O -T "#[align=centre] Window 9 " -x M -y M \
    "Go to" Enter "select-window -t :9" \
    "Rename" r "command-prompt -I '#W' -p 'name:' { rename-window -t :9 '%%' }" \
    "" \
    "Move ←" < "swap-window -s :9 -t :8" \
    "Move →" > "swap-window -s :9 -t :10" \
    "" \
    "#[fg=red]Close window" x "confirm-before -p 'Close window 9? (y/n)' 'kill-window -t :9'"
%else
# Action strip on the BOTTOM border of the pane (right above the tabs).
# Clicking anywhere on the strip opens the actions menu under the mouse.
# Why not separate buttons: in tmux 3.4 a click on a border carries no mouse_x/mouse_y
# (only inside the pane or on the status bar), and the top border emits no event at all.
# tmux >= 3.7 provides both; there it becomes real buttons, at the top.
set -g pane-border-status bottom
set -g pane-border-lines single
set -g @strip "#[fg=#d0d0d0,bg=#5c5c6e,nobold] ☰ Actions: New · Split · Zoom · Close · Menu #[default]"
set -g pane-border-format "#{?#{&&:#{pane_at_left},#{pane_at_bottom}},#{E:@strip},#[fg=#8a8a8a] #{pane_index}: #{pane_current_command} }"

bind -n MouseDown1Border select-pane -t = \; display-menu -O -T "#[align=centre] Actions " -x 2 -y S \
    "New window"        c "new-window -c '#{pane_current_path}'" \
    "Split ◧"           | "split-window -h -c '#{pane_current_path}'" \
    "Split ⬒"           - "split-window -v -c '#{pane_current_path}'" \
    "" \
    "Zoom (toggle)"     z "resize-pane -Z" \
    "Even panes"        = "select-layout even-horizontal" \
    "Rename window"     , "command-prompt -I '#W' -p 'name:' { rename-window '%%' }" \
    "" \
    "Full menu"         m "run-shell ~/.tmux/plugins/tmux-menus/items/main.sh" \
    "" \
    "#[fg=red]Close pane"   x "confirm-before -p 'Close this pane? (y/n)' kill-pane" \
    "#[fg=red]Close window" X "confirm-before -p 'Close this window? (y/n)' kill-window"

# Left click on the bottom bar: tab → switch window; session → list; cpu/ram → btop (tmux2k)
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},window}' { select-window -t = } {
  if -F '#{==:#{mouse_status_range},session}' { choose-tree -sZ -O name } {
  if -F '#{||:#{==:#{mouse_status_range},cpu},#{==:#{mouse_status_range},ram}}' { run-shell -b "~/.tmux/plugins/tmux2k/lib/popup_handler.sh right '#{mouse_x}' '#{client_width}' '#{mouse_status_range}'" } } }
%endif

# Browser-style tabs
bind -n DoubleClick1StatusDefault new-window -c "#{pane_current_path}"   # double click on empty space = new window
bind -n MouseDown2Status if -F '#{==:#{mouse_status_range},window}' { confirm-before -p "Close window #{window_name}? (y/n)" "kill-window -t =" }   # middle button closes
bind -n MouseDrag1Status if -F '#{==:#{mouse_status_range},window}' { swap-window -d -t = }   # drag reorders

# Right click on a tab
bind -n MouseDown3Status if -F '#{==:#{mouse_status_range},session}' { display-menu -O -T "#[align=centre] Sessions " -x M -y S "Choose session" s "choose-tree -sZ -O name" "New session" N "command-prompt -p 'new session:' { new-session -d -s '%%' -c ~ ; switch-client -t '%%' }" "Rename session" $ "command-prompt -I '#S' -p 'name:' { rename-session '%%' }" "" "Detach" d "detach-client" } {
  if -F '#{==:#{mouse_status_range},window}' {
  display-menu -O -T "#[align=centre] #{window_index}: #{window_name} " -x W -y S \
    "Go to"            Enter "select-window -t =" \
    "Rename"           r     "command-prompt -I '#W' -p 'name:' { rename-window -t = '%%' }" \
    "" \
    "Move ←"           <     "swap-window -d -t -1" \
    "Move →"           >     "swap-window -d -t +1" \
    "" \
    "#[fg=red]Close window" x "kill-window -t ="
} }

# Right click on a pane
bind -n MouseDown3Pane select-pane -t = \; display-menu -O -T "#[align=centre] Pane " -x M -y M \
    "New window"       c "new-window -c '#{pane_current_path}'" \
    "Split ◧"          | "split-window -h -c '#{pane_current_path}'" \
    "Split ⬒"          - "split-window -v -c '#{pane_current_path}'" \
    "" \
    "Zoom (toggle)"    z "resize-pane -Z" \
    "Even panes"       = "select-layout even-horizontal" \
    "Rename window"    , "command-prompt -I '#W' -p 'name:' { rename-window '%%' }" \
    "Paste"            p "paste-buffer -p" \
    "" \
    "Full menu"        m "run-shell ~/.tmux/plugins/tmux-menus/items/main.sh" \
    "" \
    "#[fg=red]Close pane"   x "kill-pane" \
    "#[fg=red]Close window" X "kill-window"

# Right click on the session name (left side of the bar)
bind -n MouseDown3StatusLeft display-menu -O -T "#[align=centre] Sessions " -x M -y S \
    "Choose session"   s "choose-tree -sZ -O name" \
    "New session"      N "command-prompt -p 'new session:' { new-session -d -s '%%' -c ~ ; switch-client -t '%%' }" \
    "Rename session"   $ "command-prompt -I '#S' -p 'name:' { rename-session '%%' }" \
    "" \
    "Detach"           d "detach-client"

# tmux-menus (prefix + \ or the ☰ button)
set -g @menus_location_x 'C'
set -g @menus_location_y 'C'
run-shell ~/.tmux/plugins/tmux-menus/menus.tmux
